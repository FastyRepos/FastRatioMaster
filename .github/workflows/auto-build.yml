name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore
        run: msbuild RatioMaster.sln /t:restore /p:RestorePackagesConfig=true

      - name: Build
        run: msbuild RatioMaster.sln /t:Rebuild /p:DebugType=None /p:Configuration=Release -m

      - name: Publish build
        uses: actions/upload-artifact@v4
        with:
          name: RatioMaster
          path: RatioMaster/bin
